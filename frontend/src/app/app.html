<main class="app">
  <header class="app-header">
    <h1>👾 MON ENTREPRISE <span class="sub">le jeu du petit boss</span></h1>
    <span class="player">🎮 {{ playerName() }}</span>
  </header>

  @if (store.isActive()) {
    <!-- GAME LOOP — once the company is started -->
    <app-game [playerName]="playerName()" />
  } @else {
    <!-- INITIALIZATION — create company, pick avatar, generate icon -->
    <app-company [playerName]="playerName()" />
  }
</main>
