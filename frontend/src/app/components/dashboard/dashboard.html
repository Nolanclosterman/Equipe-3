@if (store.company(); as company) {
  <section class="frame">
    <header class="frame-header">
      <h2>📊 Dashboard — {{ company.name }}</h2>
    </header>

    <!-- Scores -->
    <div class="scores">
      <div class="logo">LOGO</div>
      <app-score-gauge label="Score argent" icon="💰" [value]="company.scores.money" color="#3b82f6" />
      <app-score-gauge label="Score écologie" icon="🌱" [value]="company.scores.ecology" color="#22c55e" />
      <app-score-gauge label="Score éthique" icon="🛡️" [value]="company.scores.ethics" color="#8b5cf6" />
    </div>

    <!-- Company image / icon generation -->
    <div class="image-row">
      <div class="image">
        @if (company.iconUrl) {
          <img [src]="company.iconUrl" [alt]="company.name" />
        } @else {
          <span class="placeholder">🏙️ Image de l'entreprise</span>
        }
      </div>
      <button class="btn btn-generate" (click)="generateIcon()" [disabled]="store.loading()">
        ✨ Générer l'icône de l'entreprise
      </button>
    </div>

    <!-- Chat / Assistant -->
    <div class="chat">
      <h3>🤖 Chat / Assistant</h3>
      <div class="messages">
        @for (msg of company.chat; track $index) {
          <div class="message" [class.user]="msg.author === 'user'" [class.assistant]="msg.author === 'assistant'">
            <span class="bubble">{{ msg.content }}</span>
          </div>
        } @empty {
          <p class="empty">Démarre la conversation avec ton assistant…</p>
        }
      </div>
      <div class="composer">
        <input
          type="text"
          placeholder="Écris un message…"
          [ngModel]="draft()"
          (ngModelChange)="draft.set($event)"
          (keyup.enter)="send()"
          [disabled]="store.loading()"
        />
        <button class="btn btn-send" (click)="send()" [disabled]="store.loading() || !draft().trim()">
          ➤
        </button>
      </div>
    </div>
  </section>
}
