services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: equipe3-backend
    environment:
      # Read from the .env file at the repo root (docker compose loads it
      # automatically for variable substitution).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-1-mini}
    ports:
      - "8080:8080"
    volumes:
      # Persist generated images (avatars, icons, event illustrations) so the
      # one-shot assets are not re-generated on every container start.
      - generated-assets:/app/generated-assets

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: equipe3-frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  generated-assets:

