spring:
  application:
    name: backend

# Claude API configuration. Set ANTHROPIC_API_KEY in your environment (or .env at
# the repo root, read by docker-compose). When the key is missing the game falls
# back to built-in sample events so the app still runs offline.
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-opus-4-8}

# OpenAI image API (gpt-image-2) used for all generated assets: one-shot
# avatars / UI icons and runtime event illustrations. When the key is missing
# image generation is disabled and the game falls back to emoji placeholders.
openai:
  api-key: ${OPENAI_API_KEY:}
  image-model: ${OPENAI_IMAGE_MODEL:gpt-image-2}

# Where the generated PNGs are stored and served from (GET /assets/{file}).
assets:
  dir: ${ASSETS_DIR:./generated-assets}
